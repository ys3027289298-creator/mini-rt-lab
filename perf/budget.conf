# perf/budget.conf -- the single source of truth for both acceptance tiers.
#
# Every number here is an UPPER BOUND, not a target.  The harness measures
# each tier, writes the measurement table, and fails the tier if any measured
# value exceeds its bound.  Work bounds are deterministic: they are exactly
# the scheduled number of units (rays / samples / draws), so a path that does
# any extra work fails even when it is fast.
#
# Time and memory bounds leave roughly 20-100x headroom over the reference run
# recorded in artifacts/perf/REPORT.md; artifacts/perf/env.txt names the host.
# The gate is a regression gate, not a microbenchmark: it catches a path that
# gets orders of magnitude slower or allocates orders of magnitude more.

# ---------------- low tier ----------------
# 80 x 60 image, 4 BVH rays per pixel, 64 sampling draws per pixel,
# 8 material samples per pixel.
low.width=80
low.height=60
low.bvh_spp=4
low.sample_draws=64
low.material_spp=8

# work budgets = width*height*(spp|draws); verify.py re-derives these
low.max_work_units_bvh=19200
low.max_work_units_sample=307200
low.max_work_units_material=38400

# resource budgets
low.max_path_ms=100
low.max_total_ms=250
low.max_peak_rss_kib=32768

# ---------------- high tier ----------------
# 160 x 120 image, 16 BVH rays per pixel, 256 sampling draws per pixel,
# 32 material samples per pixel.
high.width=160
high.height=120
high.bvh_spp=16
high.sample_draws=256
high.material_spp=32

high.max_work_units_bvh=307200
high.max_work_units_sample=4915200
high.max_work_units_material=614400

high.max_path_ms=400
high.max_total_ms=800
high.max_peak_rss_kib=65536
